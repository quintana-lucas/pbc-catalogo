<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ROBOTS}}
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRIPCION}}">
{{METADATOS}}
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
{{FUENTES}}
<style>
{{ESTILOS_BASE}}
  /* Módulo opcional de pedidos especiales / catering (solo si "pedidos_especiales.activo" en config.json).
     Cotizador: se eligen invitados, opciones y extras; al lado, una «comanda» con el estimado. */
  main.envoltura { max-width: 1040px; padding-top: 24px; padding-bottom: 56px; }
  main h1 { font-family: var(--fuente-titulos), Georgia, serif; font-size: 2rem; margin: 20px 0 8px; color: var(--tinta); }
  .intro { color: var(--suave); margin: 0 0 28px; max-width: 62ch; }
  .cotizador { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: start; }
  fieldset { border: 0; margin: 0 0 28px; padding: 0; min-width: 0; }
  legend {
    font-family: var(--fuente-titulos), Georgia, serif; font-weight: 800; font-size: 1.25rem;
    color: var(--tinta); padding: 0; margin-bottom: 12px;
  }
  .opciones { display: grid; gap: 10px; }
  .opcion {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; cursor: pointer;
    background: var(--papel); border: 1.5px solid var(--linea); border-radius: 14px;
  }
  .opcion:has(input:checked) { border-color: var(--principal); box-shadow: 0 0 0 1px var(--principal); }
  .opcion input { width: 20px; height: 20px; margin: 3px 0 0; flex: none; accent-color: var(--principal); }
  .opcion .texto { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .opcion strong { font-weight: 700; }
  .opcion small { color: var(--suave); font-size: .9rem; }
  .opcion .precio { font-weight: 800; white-space: nowrap; text-align: right; font-size: .92rem; font-variant-numeric: tabular-nums; }
  .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .campo label { font-weight: 700; font-size: .95rem; }
  .campo small { color: var(--suave); }
  input[type=number], input[type=date], input[type=text] {
    width: 100%; min-width: 0; font: inherit; color: var(--tinta); background: var(--papel);
    border: 1.5px solid var(--borde-control); border-radius: 10px; padding: 11px 13px;
  }
  /* La comanda: hoja rayada donde se escribe. Todo lo de adentro mide un múltiplo de --r para caer sobre los renglones. */
  .comanda { --r: 32px; --manuscrita: "Caveat", "Segoe Print", "Bradley Hand", cursive; position: sticky; top: 16px; }
  .hoja {
    position: relative; padding: var(--r) 20px var(--r) 68px; line-height: var(--r);
    background-color: var(--papel);
    background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--r) - 1.5px), var(--linea) calc(var(--r) - 1.5px) var(--r));
    background-position: 0 calc(var(--r) * 2);
    border: 1.5px solid var(--linea); border-radius: 6px; box-shadow: var(--sombra);
  }
  .hoja::before { content: ""; position: absolute; top: 0; bottom: 0; left: 52px; width: 2px; background: var(--principal); opacity: .28; }
  .comanda h2 { font-family: var(--fuente-titulos), Georgia, serif; font-size: 1.7rem; line-height: calc(var(--r) * 2); color: var(--tinta); margin: 0; }
  .manuscrito { font-family: var(--manuscrita); font-size: 1.45rem; font-weight: 500; color: var(--tinta); }
  .datos-evento { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; }
  .datos-evento dt { font-family: var(--fuente-texto), system-ui, sans-serif; font-size: .9rem; color: var(--suave); font-weight: 700; }
  .datos-evento dd { margin: 0; overflow-wrap: anywhere; }
  .linea { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .linea .nombre { min-width: 0; flex: 1; position: relative; }
  .linea .nombre small { font-family: var(--fuente-texto), system-ui, sans-serif; font-size: .8rem; color: var(--suave); margin-left: 6px; }
  .monto { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .linea .monto { position: relative; font-family: var(--manuscrita); font-size: 1.45rem; font-weight: 700; }
  /* Opción destildada: se tacha un instante y desaparece (la única animación; se apaga con prefers-reduced-motion) */
  .linea.tachada { color: var(--suave); }
  .linea.tachada .nombre::after, .linea.tachada .monto::after {
    content: ""; position: absolute; left: 0; right: 0; top: 55%; height: 2px; background: var(--tinta);
    transform-origin: left; animation: tachar .35s ease-out both;
  }
  @keyframes tachar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .linea.tachada .nombre::after, .linea.tachada .monto::after { animation: none; } }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: var(--r); }
  .total span:first-child { font-weight: 700; }
  .total .monto { font-family: var(--manuscrita); font-size: 2.1rem; font-weight: 700; color: var(--tinta); text-decoration: underline double; text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
  .por-persona { text-align: right; margin: 0; }
  .por-persona .monto { text-decoration: underline double; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .nota, .vacio, .aviso { margin: 0; font-size: .92rem; color: var(--suave); }
  .vacio { font-family: var(--manuscrita); font-size: 1.3rem; }
  .aviso { color: var(--alerta); font-weight: 700; }
  .barra, .cerrar { display: none; }
  .acciones { display: flex; flex-direction: column; gap: 10px; margin-top: var(--r); line-height: 1.3; }
  .btn {
    border: 0; border-radius: 999px; padding: 13px 22px; font: inherit; font-weight: 800; cursor: pointer; text-decoration: none;
    background: var(--principal); color: var(--sobre-principal); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { background: var(--principal-osc); }
  .btn-sec { background: var(--papel); color: var(--tinta); box-shadow: inset 0 0 0 1.5px var(--linea); }
  .btn-sec:hover { background: var(--fondo); }
  .copia {
    width: 100%; min-height: 120px; font: inherit; color: var(--tinta); background: var(--fondo);
    border: 1.5px solid var(--borde-control); border-radius: 10px; padding: 10px;
  }
  footer { padding-bottom: 32px; }
  @media (max-width: 760px) {
    .cotizador { grid-template-columns: 1fr; gap: 8px; }
    main.envoltura { padding-bottom: 96px; }
    /* Celular: la comanda es una barra fija con el total; al tocarla se abre el papel completo */
    .comanda { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; top: auto; }
    .barra {
      display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px;
      padding: 8px 18px calc(8px + env(safe-area-inset-bottom)); font: inherit; color: var(--tinta); cursor: pointer;
      background: var(--papel); border: 0; border-top: 3px solid var(--principal); box-shadow: 0 -6px 20px rgba(0,0,0,.12);
    }
    .barra .rotulo { display: flex; flex-direction: column; text-align: left; font-size: .85rem; color: var(--suave); line-height: 1.2; }
    .barra .rotulo b { color: var(--tinta); font-size: .95rem; }
    .barra .monto { font-family: var(--manuscrita); font-size: 1.9rem; line-height: 1; color: var(--tinta); text-decoration: underline double; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
    .barra .ver { font-weight: 800; color: var(--principal); font-size: .9rem; }
    .hoja { display: none; border-radius: 14px 14px 0 0; max-height: 82vh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
    .comanda.abierta { top: 0; background: rgba(0,0,0,.45); display: flex; flex-direction: column; justify-content: flex-end; }
    .comanda.abierta .hoja { display: block; }
    .comanda.abierta .barra { display: none; }
    .cerrar {
      display: block; position: sticky; top: 0; float: right; margin: -24px -12px 0 0; z-index: 1; width: 44px; height: 44px; font-size: 1.6rem;
      line-height: 1; border: 0; border-radius: 50%; background: var(--papel); color: var(--tinta); cursor: pointer;
    }
  }
  @media (max-width: 480px) {
    .campos { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
{{ENCABEZADO}}

<main class="envoltura">
  <h1>{{PEDIDOS_TITULO}}</h1>
  <p class="intro">{{PEDIDOS_TEXTO}}</p>

  <div class="cotizador">
    <form id="form" novalidate>
      <fieldset>
        <legend>¿Cuántos invitados?</legend>
        <div class="campo">
          <input id="personas" type="number" min="1" step="1" inputmode="numeric" aria-label="Cantidad de invitados">
          <small id="minimo" hidden></small>
        </div>
      </fieldset>
      <fieldset id="bloque-opciones" hidden>
        <legend>¿Qué querés incluir?</legend>
        <div class="opciones" id="opciones"></div>
      </fieldset>
      <fieldset id="bloque-extras" hidden>
        <legend>Extras</legend>
        <div class="opciones" id="extras"></div>
      </fieldset>
      <fieldset>
        <legend>Sobre tu evento</legend>
        <div class="campos">
          <div class="campo">
            <label for="fecha">Fecha</label>
            <input id="fecha" type="date">
          </div>
          <div class="campo">
            <label for="zona">Zona o barrio</label>
            <input id="zona" type="text" placeholder="Ej: Palermo" autocomplete="address-level2">
          </div>
        </div>
      </fieldset>
    </form>
    <aside class="comanda" id="comanda" aria-live="polite"></aside>
  </div>
</main>

<footer>{{PIE}}</footer>

<script id="datos" type="application/json">{{DATOS}}</script>
<script>
(function () {
  const DATOS = JSON.parse(document.getElementById("datos").textContent);
  const formato = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
  const pesos = n => formato.format(Math.round(Number(n) || 0));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);
  const minimo = DATOS.minimo_personas || 1;
  const WA_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';

  $("personas").value = DATOS.personas_por_defecto || "";
  if (minimo > 1) {
    $("minimo").hidden = false;
    $("minimo").textContent = `Desde ${minimo} invitados. Para menos, consultanos.`;
  }

  // Opciones y extras vienen de data/catering.csv (o del link "catering_csv").
  // Las opciones se cobran por invitado; los extras, fijos o por invitado. Sin precio = «A consultar» y no suma.
  const precioTexto = o => !o.precio ? "A consultar" : pesos(o.precio) + (o.cobro === "persona" ? " por invitado" : "");
  function pintar(tipo, lista, bloque, caja, marcarPrimera) {
    if (!lista.length) return;
    $(bloque).hidden = false;
    $(caja).innerHTML = lista.map((o, i) => `
      <label class="opcion">
        <input type="checkbox" name="${tipo}" value="${i}" ${marcarPrimera && i === 0 ? "checked" : ""}>
        <span class="texto"><strong>${esc(o.nombre)}</strong>${o.detalle ? `<small>${esc(o.detalle)}</small>` : ""}</span>
        <span class="precio">${precioTexto(o)}</span>
      </label>`).join("");
  }
  pintar("opcion", DATOS.opciones, "bloque-opciones", "opciones", true);
  pintar("extra", DATOS.extras, "bloque-extras", "extras", false);

  const marcadas = (tipo, lista) =>
    [...document.querySelectorAll(`input[name=${tipo}]:checked`)].map(c => lista[+c.value]);

  function cotizar() {
    const personas = Math.max(0, Math.floor(Number($("personas").value) || 0));
    const opciones = marcadas("opcion", DATOS.opciones);
    const extras = marcadas("extra", DATOS.extras);
    const lineas = [...opciones.map(o => ["o", o]), ...extras.map(o => ["e", o])].map(([t, o]) => {
      const porPersona = o.cobro === "persona";
      return {
        clave: t + (t === "o" ? DATOS.opciones : DATOS.extras).indexOf(o),
        nombre: o.nombre,
        detalle: porPersona && o.precio ? `${personas} × ${pesos(o.precio)}` : "",
        monto: o.precio ? (porPersona ? o.precio * personas : o.precio) : null,
      };
    });
    const total = lineas.reduce((suma, l) => suma + (l.monto || 0), 0);
    return { personas, opciones, extras, lineas, total, porPersona: personas ? total / personas : 0 };
  }

  // Mensaje de WhatsApp, igual al del borrador del cliente: una línea por dato, sin líneas vacías.
  function mensaje(q) {
    const fecha = $("fecha").value ? $("fecha").value.split("-").reverse().join("/") : "";
    const zona = $("zona").value.trim();
    return [
      DATOS.mensaje,
      `Invitados: ${q.personas}`,
      q.opciones.length && `Incluye: ${q.opciones.map(o => o.nombre).join(", ")}`,
      q.extras.length && `Extras: ${q.extras.map(o => o.nombre).join(", ")}`,
      fecha && `Fecha: ${fecha}`,
      zona && `Zona: ${zona}`,
      q.total && `Estimado de la web: ${pesos(q.total)}`,
    ].filter(Boolean).join("\n");
  }
  const linkWhatsapp = texto => `https://wa.me/${DATOS.whatsapp}?text=${encodeURIComponent(texto)}`;

  // Líneas tachadas: al destildar una opción su renglón queda un instante tachado antes de borrarse.
  const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)");
  const fantasmas = new Map();
  let previas = new Map();
  const htmlLinea = (l, clase) => `<div class="linea manuscrito${clase}"${clase ? ' aria-hidden="true"' : ""}><span class="nombre">${esc(l.nombre)}${l.detalle ? `<small>${esc(l.detalle)}</small>` : ""}</span><span class="monto">${l.monto == null ? "A consultar" : pesos(l.monto)}</span></div>`;

  function actualizar() {
    const q = cotizar();
    const fecha = $("fecha").value ? $("fecha").value.split("-").reverse().join("/") : "";
    const zona = $("zona").value.trim();
    const vigentes = new Map(q.lineas.map(l => [l.clave, l]));
    // Las que estaban y ya no: se tachan (salvo con prefers-reduced-motion).
    previas.forEach((l, k) => {
      if (vigentes.has(k) || fantasmas.has(k) || sinMovimiento.matches) return;
      fantasmas.set(k, { l, t: setTimeout(() => { fantasmas.delete(k); actualizar(); }, 900) });
    });
    vigentes.forEach((_, k) => { if (fantasmas.has(k)) { clearTimeout(fantasmas.get(k).t); fantasmas.delete(k); } });
    previas = vigentes;
    const todas = [...vigentes].map(([k, l]) => ({ k, l, c: "" }))
      .concat([...fantasmas].map(([k, f]) => ({ k, l: f.l, c: " tachada" })))
      .sort((a, b) => a.k.localeCompare(b.k, "en", { numeric: true }));
    const lineas = todas.length
      ? todas.map(x => htmlLinea(x.l, x.c)).join("")
      : `<p class="vacio">Elegí al menos una opción para ver el estimado.</p>`;
    const hayLineas = q.lineas.length > 0;
    const abierta = $("comanda").classList.contains("abierta");
    $("comanda").innerHTML =
      `<button type="button" class="barra" id="abrir" aria-expanded="${abierta}" aria-controls="hoja"><span class="rotulo"><b>Tu comanda</b>Total estimado</span><span class="monto">${pesos(q.total)}</span><span class="ver">Ver ▲</span></button>` +
      `<div class="hoja" id="hoja"><button type="button" class="cerrar" id="cerrar" aria-label="Cerrar la comanda">×</button><h2>Tu comanda</h2>` +
      `<dl class="datos-evento manuscrito"><dt>Fecha</dt><dd>${esc(fecha) || "&nbsp;"}</dd><dt>Invitados</dt><dd>${q.personas || "&nbsp;"}</dd><dt>Zona</dt><dd>${esc(zona) || "&nbsp;"}</dd></dl>` +
      `<div style="height:var(--r)"></div>` + lineas +
      `<div class="total"><span>Total estimado</span><span class="monto">${pesos(q.total)}</span></div>` +
      (hayLineas && q.personas ? `<p class="por-persona manuscrito"><span class="monto">${pesos(q.porPersona)}</span> por invitado</p>` : "") +
      (q.personas && q.personas < minimo ? `<p class="aviso">Para menos de ${minimo} invitados, consultanos.</p>` : "") +
      (DATOS.nota ? `<p class="nota">${esc(DATOS.nota)}</p>` : "") +
      `<div class="acciones">
        <a class="btn-orden" href="${esc(linkWhatsapp(mensaje(q)))}" target="_blank" rel="noopener">${WA_SVG} Pedir presupuesto por WhatsApp</a>
        <button class="btn btn-sec" type="button" id="copiar">Copiar resumen</button>
      </div></div>`;
  }
  function abrir(si) {
    $("comanda").classList.toggle("abierta", si);
    $("abrir").setAttribute("aria-expanded", String(si));
    document.body.style.overflow = si ? "hidden" : "";
    (si ? $("cerrar") : $("abrir")).focus();
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("comanda").classList.contains("abierta")) abrir(false); });
  $("form").addEventListener("input", actualizar);
  $("form").addEventListener("submit", e => e.preventDefault());

  // Copiar resumen: si el navegador no deja usar el portapapeles, muestra el texto seleccionado para copiarlo a mano.
  $("comanda").addEventListener("click", e => {
    if (e.target.closest("#abrir")) return abrir(true);
    if (e.target.closest("#cerrar") || e.target === $("comanda")) return abrir(false);
    const boton = e.target.closest("#copiar");
    if (!boton) return;
    const texto = mensaje(cotizar());
    const listo = () => { boton.textContent = "¡Copiado!"; setTimeout(() => { boton.textContent = "Copiar resumen"; }, 1500); };
    const aMano = () => {
      const acciones = boton.closest(".acciones");
      let caja = acciones.querySelector(".copia");
      if (!caja) {
        caja = document.createElement("textarea");
        caja.className = "copia";
        caja.readOnly = true;
        caja.setAttribute("aria-label", "Resumen para copiar");
        acciones.appendChild(caja);
      }
      caja.value = texto;
      caja.focus();
      caja.select();
    };
    try { navigator.clipboard.writeText(texto).then(listo, aMano); } catch (_) { aMano(); }
  });
  actualizar();
})();
</script>
</body>
</html>
