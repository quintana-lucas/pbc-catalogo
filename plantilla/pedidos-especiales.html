<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ROBOTS}}
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRIPCION}}">
{{METADATOS}}
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
{{FUENTES}}
<style>
{{ESTILOS_BASE}}
  /* Módulo opcional de pedidos especiales / catering (solo si "pedidos_especiales.activo" en config.json) */
  main.envoltura { max-width: 720px; padding-top: 24px; padding-bottom: 56px; }
  .volver { color: var(--principal); font-weight: 800; text-decoration: none; }
  .volver:hover { text-decoration: underline; }
  main h1 { font-family: var(--fuente-titulos), Georgia, serif; font-size: 2rem; margin: 20px 0 8px; }
  .intro { color: var(--suave); margin: 0 0 20px; }
  form {
    background: var(--papel); border-radius: var(--radio); box-shadow: var(--sombra);
    padding: 20px 24px; display: grid; gap: 16px;
  }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label, legend { font-weight: 800; display: block; margin-bottom: 6px; }
  .opcional { font-weight: 400; color: var(--suave); }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--tinta); background: var(--papel);
    border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 96px; resize: vertical; }
  fieldset { border: 0; margin: 0; padding: 0; }
  .opciones { display: grid; gap: 8px; }
  .opcion {
    display: flex; gap: 12px; align-items: flex-start; font-weight: 400; margin: 0;
    border: 1px solid var(--linea); border-radius: 12px; padding: 12px; cursor: pointer;
  }
  .opcion:has(input:checked) { border-color: var(--principal); box-shadow: 0 0 0 1px var(--principal); }
  .opcion input { width: auto; margin-top: 4px; accent-color: var(--principal); }
  .opcion strong { display: block; }
  .opcion small { color: var(--suave); }
  .opcion .precio { margin-left: auto; font-weight: 800; white-space: nowrap; }
  .estimado {
    background: var(--fondo); border-left: 4px solid var(--secundario); border-radius: 10px;
    padding: 12px 16px; display: none;
  }
  .estimado.visible { display: block; }
  .estimado strong { font-size: 1.3rem; display: block; }
  .estimado small { color: var(--suave); }
  .estimado .linea { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--linea); }
  .estimado .linea small { display: block; }
  .estimado .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; }
  .estimado .aviso { margin: 8px 0 0; font-weight: 600; color: var(--alerta); }
  .btn-sec { background: transparent; color: var(--principal); border: 2px solid var(--principal); }
  .btn-sec:hover { background: var(--fondo); }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 800; cursor: pointer;
    background: #25d366; color: #0b3d20; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { background: #1fbe5b; }
  .error { color: var(--alerta); font-weight: 600; margin: 0; display: none; }
  .error.visible { display: block; }
  footer { padding-bottom: 32px; }
  @media (max-width: 480px) {
    form { padding: 16px; }
    .fila { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="envoltura">
    {{SELLOS}}
    <a class="marca" href="./"><img class="logo" src="{{LOGO}}" alt="{{NOMBRE}} — volver al catálogo" width="{{LOGO_ANCHO}}" height="{{LOGO_ALTO}}"></a>
    <nav class="redes" aria-label="Redes">{{REDES}}</nav>
  </div>
</header>

<main class="envoltura">
  <a class="volver" href="./">← Volver al catálogo</a>
  <h1>{{PEDIDOS_TITULO}}</h1>
  <p class="intro">{{PEDIDOS_TEXTO}}</p>

  <form id="form" novalidate>
    <div>
      <label for="nombre">Tu nombre</label>
      <input id="nombre" name="nombre" autocomplete="name" required>
    </div>
    <div class="fila">
      <div>
        <label for="tipo">¿Qué necesitás?</label>
        <select id="tipo" name="tipo">{{PEDIDOS_TIPOS}}</select>
      </div>
      <div>
        <label for="fecha">Fecha <span class="opcional">(aprox.)</span></label>
        <input id="fecha" name="fecha" type="date">
      </div>
    </div>
    <div class="fila">
      <div>
        <label for="personas">Cantidad de personas</label>
        <input id="personas" name="personas" type="number" inputmode="numeric" min="1" step="1">
      </div>
      <div>
        <label for="zona">Zona o dirección <span class="opcional">(opcional)</span></label>
        <input id="zona" name="zona" autocomplete="address-level2">
      </div>
    </div>
    <fieldset id="bloque-opciones" hidden>
      <legend>¿Qué querés incluir?</legend>
      <div class="opciones" id="opciones"></div>
    </fieldset>
    <fieldset id="bloque-extras" hidden>
      <legend>Extras</legend>
      <div class="opciones" id="extras"></div>
    </fieldset>
    <div class="estimado" id="estimado" aria-live="polite"></div>
    <div>
      <label for="detalle">Contanos más <span class="opcional">(menú, restricciones, horario…)</span></label>
      <textarea id="detalle" name="detalle"></textarea>
    </div>
    <p class="error" id="error" role="alert"></p>
    <button class="btn" type="submit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
      Enviar consulta por WhatsApp
    </button>
    <button class="btn btn-sec" type="button" id="copiar">Copiar resumen</button>
  </form>
</main>

<footer>{{NOMBRE}}</footer>

<script id="datos" type="application/json">{{DATOS}}</script>
<script>
(function () {
  const DATOS = JSON.parse(document.getElementById("datos").textContent);
  const pesos = n => "$" + Math.round(n).toLocaleString("es-AR");
  const esc = s => String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);
  const minimo = DATOS.minimo_personas || 1;
  $("personas").min = 1;
  $("personas").placeholder = minimo > 1 ? `Desde ${minimo}` : "";

  // Cotizador: opciones y extras vienen de data/catering.csv (o del link "catering_csv").
  // Las opciones se cobran por persona; los extras, fijos o por persona. Sin precio = «A consultar».
  const precioTexto = o => !o.precio ? "A consultar" : `${pesos(o.precio)}${o.cobro === "persona" ? " <small>/ persona</small>" : ""}`;
  function pintar(tipo, lista, bloque, caja, marcarPrimera) {
    if (!lista.length) return;
    $(bloque).hidden = false;
    $(caja).innerHTML = lista.map((o, i) => `
      <label class="opcion">
        <input type="checkbox" name="${tipo}" value="${i}" ${marcarPrimera && i === 0 ? "checked" : ""}>
        <span><strong>${esc(o.nombre)}</strong>${o.detalle ? `<small>${esc(o.detalle)}</small>` : ""}</span>
        <span class="precio">${precioTexto(o)}</span>
      </label>`).join("");
  }
  pintar("opcion", DATOS.opciones, "bloque-opciones", "opciones", true);
  pintar("extra", DATOS.extras, "bloque-extras", "extras", false);

  const marcadas = (tipo, lista) =>
    [...document.querySelectorAll(`input[name=${tipo}]:checked`)].map(c => lista[+c.value]);

  function cotizar() {
    const personas = parseInt($("personas").value, 10) || 0;
    const lineas = [
      ...marcadas("opcion", DATOS.opciones),
      ...marcadas("extra", DATOS.extras),
    ].map(o => {
      const porPersona = o.cobro === "persona";
      return {
        nombre: o.nombre,
        detalle: o.precio && porPersona && personas ? `${personas} × ${pesos(o.precio)}` : "",
        monto: o.precio ? (porPersona ? o.precio * personas : o.precio) : null,
      };
    });
    const total = lineas.reduce((suma, l) => suma + (l.monto || 0), 0);
    return { personas, lineas, total, porPersona: personas ? total / personas : 0 };
  }
  function actualizar() {
    const q = cotizar();
    const caja = $("estimado");
    const visible = q.lineas.length > 0 && q.personas > 0;
    caja.classList.toggle("visible", visible);
    if (!visible) return;
    caja.innerHTML = "<strong>Tu estimado</strong>" +
      q.lineas.map(l => `<div class="linea"><span>${esc(l.nombre)}${l.detalle ? `<small>${esc(l.detalle)}</small>` : ""}</span><span>${l.monto == null ? "A consultar" : pesos(l.monto)}</span></div>`).join("") +
      `<div class="total"><span>Total estimado</span><strong>${pesos(q.total)}</strong></div>` +
      (q.total ? `<small>${pesos(q.porPersona)} por persona</small>` : "") +
      (q.personas < minimo ? `<p class="aviso">Para menos de ${minimo} personas, consultanos.</p>` : "") +
      (DATOS.nota ? `<small>${esc(DATOS.nota)}</small>` : "");
  }
  $("form").addEventListener("input", actualizar);

  // Arma el mensaje de WhatsApp. Devuelve null (y muestra el error) si falta algún dato.
  function armarMensaje() {
    const nombre = $("nombre").value.trim();
    const q = cotizar();
    const error = $("error");
    let falta = "";
    if (!nombre) falta = "Decinos tu nombre.";
    else if (!(q.personas >= 1)) falta = "Indicá para cuántas personas es.";
    error.textContent = falta;
    error.classList.toggle("visible", !!falta);
    if (falta) return null;

    const opciones = marcadas("opcion", DATOS.opciones).map(o => o.nombre);
    const extras = marcadas("extra", DATOS.extras).map(o => o.nombre);
    const fecha = $("fecha").value ? $("fecha").value.split("-").reverse().join("/") : "";
    const lineas = [
      `• Nombre: ${nombre}`,
      `• Tipo: ${$("tipo").value}`,
      fecha && `• Fecha: ${fecha}`,
      `• Personas: ${q.personas}`,
      opciones.length && `• Incluye: ${opciones.join(", ")}`,
      extras.length && `• Extras: ${extras.join(", ")}`,
      $("zona").value.trim() && `• Zona: ${$("zona").value.trim()}`,
      $("detalle").value.trim() && `• Detalle: ${$("detalle").value.trim()}`,
      q.total && `\nPresupuesto estimado: ${pesos(q.total)} (a confirmar)`,
    ].filter(Boolean);
    return `${DATOS.mensaje}\n\n${lineas.join("\n")}`;
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const texto = armarMensaje();
    if (texto) window.open(`https://wa.me/${DATOS.whatsapp}?text=${encodeURIComponent(texto)}`, "_blank", "noopener");
  });

  $("copiar").addEventListener("click", async () => {
    const texto = armarMensaje();
    if (!texto) return;
    const boton = $("copiar");
    try {
      await navigator.clipboard.writeText(texto);
      boton.textContent = "¡Copiado!";
    } catch (_) {
      boton.textContent = "No se pudo copiar";
    }
    setTimeout(() => { boton.textContent = "Copiar resumen"; }, 2000);
  });
  actualizar();
})();
</script>
</body>
</html>
